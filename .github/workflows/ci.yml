name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run backend tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pytest backend/tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build and export frontend (static)
        run: |
          cd frontend
          npm run build

      - name: Start backend (uvicorn)
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8000/api/ping >/dev/null 2>&1; then
              echo "backend up" && break
            fi
            sleep 1
          done

      - name: Run frontend unit + integration tests (Vitest)
        run: |
          cd frontend
          TEST_BASE=http://127.0.0.1:8000 npx vitest --run

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Run Playwright E2E
        run: |
          cd frontend
          npx playwright test --reporter=list
